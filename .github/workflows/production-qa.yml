name: Production QA
# Re-run the complete validation suite for every pull-request update.
# Keep the preview and production build gates aligned.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, engine tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is not committed yet; avoid setup-node npm cache and use npm install.
      - name: Install dependencies (manifest-based until lockfile is committed)
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Trading engine unit tests
        run: npm test
      - name: Next.js production build
        run: npm run build
